<!DOCTYPE html>
<head>
	<script type="text/javascript" src="pack.js"></script>
	<script type="text/javascript" src="puzzle.js"></script>
	<script type="text/javascript" src="cryptogram.js"></script>
		<link rel="stylesheet" type="text/css" href="cryptogram.css">
	<link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
	<h1>Cryptogram 0.8</h1>
	<div id="puzzle_container">
	</div>
	<div class="toolbar">
		<button id="delete">DELETE</button>
		<button id="reset">RESET</button>
	</div>
	<p>
	<a href="create.html">Create new puzzle</a>
	</p>
	<h2>Unused letters:</h2>
	<div id="unused">
	</div>
	<h2>Keyboard:</h2>
	<div id="keyboard">
		<span class="kb_letter">Q</span>
		<span class="kb_letter">W</span>
		<span class="kb_letter">E</span>
		<span class="kb_letter">R</span>
		<span class="kb_letter">T</span>
		<span class="kb_letter">Y</span>
		<span class="kb_letter">U</span>
		<span class="kb_letter">I</span>
		<span class="kb_letter">O</span>
		<span class="kb_letter">P</span>
		<br>
		<span class="kb_letter">A</span>
		<span class="kb_letter">S</span>
		<span class="kb_letter">D</span>
		<span class="kb_letter">F</span>
		<span class="kb_letter">G</span>
		<span class="kb_letter">H</span>
		<span class="kb_letter">J</span>
		<span class="kb_letter">K</span>
		<span class="kb_letter">L</span>
		<br>
		<span class="kb_letter">Z</span>
		<span class="kb_letter">X</span>
		<span class="kb_letter">C</span>
		<span class="kb_letter">V</span>
		<span class="kb_letter">B</span>
		<span class="kb_letter">N</span>
		<span class="kb_letter">M</span>
	</div>
	<dialog id="solved">
		<h1>Great success!</h1>
		<p class="result">
		Puzzle solved in <span id="solve_time"></span> (total elapsed <span
			id="total_elapsed"></span>).
		</p>
		<p class="msg">
		The result has been copied to your clipboard. After sharing it, press
		CLOSE and create a new puzzle!
		</p>
		<div class="toolbar">
			<button id="close_success">CLOSE</button>
		</div>
	</dialog>
	<template id="letter_template">
		<div class="letter">
			<div class="plain">
			</div>
			<div class="cipher">
			</div>
		</div>
	</template>
	<template id="non_coded_letter_template">
		<div class="letter">
		</div>
	</template>
</body>
