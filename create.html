<!DOCTYPE html>
<head>
	<script type="text/javascript" src="pack.js"></script>
	<script type="text/javascript" src="puzzle.js"></script>
	<script type="text/javascript" src="create.js"></script>
	<link rel="stylesheet" type="text/css" href="cryptogram.css">
	<link rel="stylesheet" type="text/css" href="create.css">
	<link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
	<h1>Create Cryptogram 0.9</h1>
	<div id="puzzle_container">
	</div>
	<div id="create_puzzle">
		<div class="msg">Enter the plaintext of your new puzzle here:</div>
		<div id="create_text" contenteditable="true">
		</div>
		<label class="msg">
			<input id="use_emojis" type="checkbox" checked>Use emojis
		</label>
		<dialog id="finished">
			<p class="msg">
			New puzzle created. The link below has been copied to your clipboard.
			Please share it with your friends.
			</p>
			<div id="url"></div>
			<div class="toolbar">
				<button id="close">CLOSE</button>
			</div>
		</dialog>
		<div class="toolbar">
			<button id="reset">RESET</button>
			<button id="done">DONE</button>
		</div>
	</div>
	<template id="letter_template">
		<div class="letter">
			<div class="plain">
			</div>
			<div class="cipher">
			</div>
		</div>
	</template>
	<template id="non_coded_letter_template">
		<div class="letter">
		</div>
	</template>
</body>
